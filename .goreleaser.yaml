version: 2
project_name: seo-mcp

builds:
  - id: seo-mcp
    main: ./cmd/seo-mcp
    binary: seo-mcp
    env:
      - CGO_ENABLED=0
    goos:
      - linux
      - darwin
      - windows
    goarch:
      - amd64
      - arm64
    flags:
      - -trimpath
    ldflags:
      - -s -w -X main.version={{ .Version }}

archives:
  - id: seo-mcp
    ids:
      - seo-mcp
    formats:
      - tar.gz
    name_template: '{{ .ProjectName }}_{{ .Version }}_{{ .Os }}_{{ .Arch }}'
    format_overrides:
      - goos: windows
        formats:
          - zip
    files:
      - LICENSE
      - README.md
      - CHANGELOG.md
      - SECURITY.md

checksum:
  name_template: checksums.txt
  algorithm: sha256

changelog:
  sort: asc

release:
  prerelease: auto
